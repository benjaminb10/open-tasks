<div style="margin:0;padding:0;background:#f7f7f8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;">
  <div style="max-width:440px;margin:0 auto;padding:40px 24px;">
    <div style="background:#ffffff;border:1px solid #ececf0;border-radius:16px;padding:36px 32px;text-align:center;">
      <div style="width:48px;height:48px;margin:0 auto 18px;background:#2f7cf6;border-radius:14px;line-height:48px;color:#ffffff;font-size:24px;font-weight:700;">&#10003;</div>
      <h1 style="margin:0 0 8px;font-size:20px;color:#1a1a1e;">Ton code de connexion</h1>
      <p style="margin:0 0 20px;font-size:14px;line-height:1.5;color:#6b6b76;">
        Saisis ce code dans l'app Tasks pour te connecter :
      </p>
      <div style="font-size:34px;font-weight:700;letter-spacing:10px;color:#1a1a1e;background:#f2f5ff;border-radius:12px;padding:16px 0;margin-bottom:20px;">
        {{ .Token }}
      </div>
      <p style="margin:0 0 20px;font-size:12px;color:#9a9aa5;">Ce code expire dans 1 heure.</p>
      <p style="margin:0 0 6px;font-size:12px;color:#9a9aa5;">Ou clique ce lien (sur le même appareil) :</p>
      <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#2f7cf6;color:#ffffff;text-decoration:none;font-size:14px;font-weight:600;padding:10px 24px;border-radius:12px;">
        Me connecter
      </a>
    </div>
    <p style="text-align:center;margin:18px 0 0;font-size:11px;color:#9a9aa5;">Tasks &middot; todo synchronis&eacute;e</p>
  </div>
</div>
